name: Daily South Indian Education News Scraper

on:
  schedule:
    # 30 minutes past the 2nd hour UTC = exactly 7:00 AM IST every day
    - cron: '30 1 * * *'
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub UI

jobs:
  scrape-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to check out and push to a new branch
      pull-requests: write # Needed to open the automated Pull Request
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Python Libraries
        run: |
          pip install requests beautifulsoup4 lxml newspaper3k lxml_html_clean

      - name: Execute Scraper Script
        run: python scraper.py

      # This official action checks for changes and automatically creates/updates a Pull Request!
      - name: Create Pull Request for Daily News
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "auto-update: daily south indian education updates"
          author: "Vidyabhyasam NewsBot <bot@vidyabhyasam.portal>"
          committer: "Vidyabhyasam NewsBot <bot@vidyabhyasam.portal>"
          branch: "bot/daily-news-update"
          delete-branch: true # Automatically deletes this temporary branch after you hit Merge!
          title: "📢 Daily Educational News Feed Update"
          body: |
            ### 🎓 Auto-Scraped Student Action Alerts
            Your morning automation script (`scraper.py`) has run successfully and found new educational updates!
            
            **What changed:**
            - Updated `src/data/NewsData.json` with unique, non-political student action alerts.
            - Filtered out duplicate headlines and fetched live images/summaries.
            
            👉 **Next Step:** Simply click **Merge pull request** below to publish these news updates live to your portal!
          labels: automated-update